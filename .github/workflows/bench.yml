name: bench
on: { workflow_dispatch: {}, push: { branches: [main] } }
permissions:
  contents: read
# A new run waits for the one before it; it does not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Not a required check. The Go and Rust decodes of the streams run in one container, so the
  # ratio compares the same machine. The summary has two sets of tables: the default builds and the
  # x86-64-v4 builds (Go GOAMD64=v4, Rust with the flags of docs/performance.md).
  bench:
    runs-on: ubuntu-24.04
    # The image builds Rust and Go twice (default and x86-64-v4) and the timing runs both, so a cold
    # cache takes about twice as long; a warm run is shorter. The v4 tables need AVX-512 and are
    # skipped on a runner without it.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: bench
          load: true
          push: false
          tags: jpegxr-bench:local
          cache-from: type=gha,scope=jpegxr-rs-bench
          cache-to: type=gha,mode=max,scope=jpegxr-rs-bench
      # docker run, not a RUN layer: a BuildKit cache hit would skip the timing.
      - run: |
          { echo '### Decode time of the test data streams, ms per MB of output (lower is better); default build and x86-64-v4 build'; echo
            docker run --rm jpegxr-bench:local sh tests/parity/bench.sh; } | tee -a "$GITHUB_STEP_SUMMARY"
