name: fuzz
on:
  schedule: [{ cron: '23 18 * * 5' }]
  workflow_dispatch:
    inputs:
      max_total_time:
        description: Seconds per target
        default: '600'
permissions:
  contents: read
# A new run waits for the one before it; it does not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: [decode, decode_config, decode_component, decoder, idct_pairs, post_split, out_bgr8, out_gray16]
        # `scalar` (JPEGXR_SIMD=scalar) fuzzes the decoder on the scalar tiers; the four kernel
        # targets compare a tier with scalar themselves and ignore it.
        simd: [default, scalar]
        exclude:
          - { target: idct_pairs, simd: scalar }
          - { target: post_split, simd: scalar }
          - { target: out_bgr8, simd: scalar }
          - { target: out_gray16, simd: scalar }
    timeout-minutes: 60
    env:
      MAX_TOTAL_TIME: ${{ inputs.max_total_time || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: fuzz
          load: true
          push: false
          tags: jpegxr-fuzz:local
          cache-from: type=gha,scope=jpegxr-rs-fuzz
          cache-to: type=gha,mode=max,scope=jpegxr-rs-fuzz
      # The corpus is kept between runs: restored here, copied into the container, copied back
      # out and saved, so a run goes on from where the last one stopped. One cache per target and
      # SIMD mode; the newest is restored.
      - id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ matrix.simd }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-${{ matrix.simd }}-
      # docker create + start, not a RUN layer: a BuildKit cache hit would skip the fuzzing.
      # Seeds: the jpegxr-go testdata/fuzz entries (tests/fuzz/seeds) and the synth and alpha streams;
      # new inputs go to the first corpus dir. -malloc_limit_mb is the backstop: the targets run
      # under Limits whose max_alloc is below it, so an allocation the limits did not charge is a
      # crash.
      - run: |
          mkdir -p corpus/${{ matrix.target }}
          docker create --name fuzz -e MAX_TOTAL_TIME -e TARGET=${{ matrix.target }} -e JPEGXR_SIMD=${{ matrix.simd == 'scalar' && 'scalar' || 'auto' }} jpegxr-fuzz:local \
            sh -c 'cargo +nightly fuzz run --fuzz-dir tests/fuzz $TARGET tests/fuzz/corpus/$TARGET tests/fuzz/seeds tests/data/synth tests/data/alpha -- -max_total_time=$MAX_TOTAL_TIME -timeout=20 -rss_limit_mb=2048 -malloc_limit_mb=512'
          docker cp corpus fuzz:/src/tests/fuzz/
          docker start -a fuzz
      - if: failure()
        run: docker cp fuzz:/src/tests/fuzz/artifacts/${{ matrix.target }} ./crashers
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crashers-${{ matrix.target }}-${{ matrix.simd }}
          path: crashers
      - if: always()
        run: docker cp fuzz:/src/tests/fuzz/corpus/${{ matrix.target }}/. corpus/${{ matrix.target }}/ || true
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ matrix.simd }}-${{ github.run_id }}

  # The NEON kernels: the four kernel targets, fuzzed on a native arm64 runner.
  fuzz-arm64:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: [idct_pairs, post_split, out_bgr8, out_gray16]
    timeout-minutes: 60
    env:
      MAX_TOTAL_TIME: ${{ inputs.max_total_time || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: fuzz
          load: true
          push: false
          tags: jpegxr-fuzz-arm64:local
          cache-from: type=gha,scope=jpegxr-rs-fuzz-arm64
          cache-to: type=gha,mode=max,scope=jpegxr-rs-fuzz-arm64
      # The corpus is kept between runs, as for the x86 jobs: restored here, copied into the
      # container, copied back out and saved. One cache per target; the newest is restored.
      - id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-arm64-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-arm64-
      # tests/fuzz/kernel-seeds/<target> holds inputs that crashed a kernel once (idct_pairs: a
      # 4-byte input from the first arm64 run); they are copied into the corpus first.
      - run: |
          mkdir -p corpus/${{ matrix.target }}
          docker create --name fuzz -e MAX_TOTAL_TIME -e TARGET=${{ matrix.target }} jpegxr-fuzz-arm64:local \
            sh -c 'mkdir -p tests/fuzz/corpus/$TARGET; cp -n tests/fuzz/kernel-seeds/$TARGET/* tests/fuzz/corpus/$TARGET/ 2>/dev/null;
            cargo +nightly fuzz run --fuzz-dir tests/fuzz $TARGET tests/fuzz/corpus/$TARGET -- -max_total_time=$MAX_TOTAL_TIME -timeout=20 -rss_limit_mb=2048 -malloc_limit_mb=512'
          docker cp corpus fuzz:/src/tests/fuzz/
          docker start -a fuzz
      - if: failure()
        run: docker cp fuzz:/src/tests/fuzz/artifacts/${{ matrix.target }} ./crashers
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crashers-${{ matrix.target }}-arm64
          path: crashers
      - if: always()
        run: docker cp fuzz:/src/tests/fuzz/corpus/${{ matrix.target }}/. corpus/${{ matrix.target }}/ || true
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-arm64-${{ github.run_id }}
